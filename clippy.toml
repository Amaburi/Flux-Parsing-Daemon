# Every crate denies unwrap, expect, panic and indexing at its root, because they
# all parse attacker-controlled input and a panic there is a denial of service.
#
# That reasoning does not extend to test code. A test that panics when its own
# setup fails is reporting the failure, which is exactly what it should do.
# Forcing tests to handle setup errors gracefully would push them toward
# swallowing the very errors they exist to surface.
#
# Indexing is the same case. A test that slices with a byte span and panics has
# found an out-of-bounds span, which is the result the test was written to
# report. Rewriting it as `get(..).expect(..)` produces the same panic with more
# ceremony and a less obvious failure message.
#
# So the lints stay denied in production code and are relaxed only under #[cfg(test)].
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
