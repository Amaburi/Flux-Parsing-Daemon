[package]
name = "fingerprint-terms"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
description = "Embedded terms text, signed acceptance record, and the fpd invocation gate"

[dependencies]
directories = "6.0.0"
hmac = "0.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
time = { version = "0.3.44", features = ["formatting", "parsing"] }

[build-dependencies]
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"
