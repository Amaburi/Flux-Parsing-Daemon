[package]
name = "fingerprint-tower"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
fingerprint-core = { version = "0.1.0", path = "../fingerprint-core" }
fingerprint-h2 = { version = "0.1.0", path = "../fingerprint-h2" }
fingerprint-probe = { version = "0.1.0", path = "../fingerprint-probe" }
http = "1.5.0"
rustls = "0.23.43"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net", "io-util", "rt", "time"] }
tokio-rustls = "0.26.4"
tower = "0.5.3"

[dev-dependencies]
axum = "0.8.9"
hyper = { version = "1.11.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server"] }
rcgen = "0.14.7"
rustls = "0.23.43"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
