[package]
name = "s2-h2-replay"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway M0 spike. Excluded from the workspace, so it must be self-contained
# (no `workspace = true` inheritance) and is never compiled by CI.

[dependencies]
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server"] }
rcgen = "0.14.7"
rustls = "0.23.43"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
